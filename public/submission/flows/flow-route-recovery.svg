<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">#코스복구 기능 흐름도</title><desc id="desc">이용 불가 장소만 대체 장소로 바꾸고 전체 코스를 다시 검사하는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52796f"/></marker></defs><rect width="1200" height="300" rx="28" fill="#f7f6f0"/>
  <text x="48" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#243b36">#코스복구</text><text x="48" y="80" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#52796f">문제가 있는 한 곳만 바꾸고 나머지 일정은 이어서 살린다</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" text-anchor="middle"><g fill="#ffffff" stroke="#b7c9c0" stroke-width="2"><rect x="32" y="124" width="200" height="96" rx="16"/><rect x="258" y="124" width="200" height="96" rx="16"/><rect x="484" y="124" width="200" height="96" rx="16"/><rect x="710" y="124" width="200" height="96" rx="16"/><rect x="936" y="124" width="232" height="96" rx="16"/></g>
    <g fill="#243b36" font-size="17" font-weight="700"><text x="132" y="164"><tspan x="132">코스 검사</tspan><tspan x="132" dy="25" font-size="14" font-weight="400">방문지별 상태 확인</tspan></text><text x="358" y="164"><tspan x="358">이용 불가 발견</tspan><tspan x="358" dy="25" font-size="14" font-weight="400">대체가 필요한 곳만 선택</tspan></text><text x="584" y="164"><tspan x="584">대체 후보 비교</tspan><tspan x="584" dy="25" font-size="14" font-weight="400">가능·준비·확인 후보</tspan></text><text x="810" y="164"><tspan x="810">장소 교체</tspan><tspan x="810" dy="25" font-size="14" font-weight="400">기존 순서에 적용</tspan></text><text x="1052" y="164"><tspan x="1052">전체 재검증</tspan><tspan x="1052" dy="25" font-size="14" font-weight="400">구간별 이동시간 갱신</tspan></text></g>
    <g stroke="#52796f" stroke-width="3" marker-end="url(#arrow)"><path d="M232 172 H252"/><path d="M458 172 H478"/><path d="M684 172 H704"/><path d="M910 172 H930"/></g></g>
</svg>
