<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">#LLM규정구조화 기능 흐름도</title><desc id="desc">장소를 선택한 뒤 LLM으로 공식 규정을 구조화하고 결정론적 규칙으로 상태를 판정하는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52796f"/></marker></defs><rect width="1200" height="300" rx="28" fill="#f7f6f0"/>
  <text x="48" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#243b36">#LLM규정구조화</text><text x="48" y="80" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#52796f">LLM으로 원문을 구조화한 뒤 결정론적 규칙으로 상태를 나눈다</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" text-anchor="middle"><g fill="#ffffff" stroke="#b7c9c0" stroke-width="2"><rect x="32" y="124" width="200" height="96" rx="16"/><rect x="258" y="124" width="200" height="96" rx="16"/><rect x="484" y="124" width="200" height="96" rx="16"/><rect x="710" y="124" width="200" height="96" rx="16"/><rect x="936" y="124" width="232" height="96" rx="16"/></g>
    <g fill="#243b36" font-size="17" font-weight="700"><text x="132" y="164"><tspan x="132">장소 선택</tspan><tspan x="132" dy="25" font-size="14" font-weight="400">지도에서 상세 열기</tspan></text><text x="358" y="164"><tspan x="358">공식 원문 조회</tspan><tspan x="358" dy="25" font-size="14" font-weight="400">KTO·식약처 출처</tspan></text><text x="584" y="164"><tspan x="584">LLM 구조화</tspan><tspan x="584" dy="25" font-size="14" font-weight="400">OpenRouter 조건·근거</tspan></text><text x="810" y="164"><tspan x="810">검증·규칙 판정</tspan><tspan x="810" dy="25" font-size="14" font-weight="400">형식·근거·조건 대조</tspan></text><text x="1052" y="164"><tspan x="1052">사용자 결과</tspan><tspan x="1052" dy="25" font-size="14" font-weight="400">출입 뱃지·4상태·문의</tspan></text></g>
    <g stroke="#52796f" stroke-width="3" marker-end="url(#arrow)"><path d="M232 172 H252"/><path d="M458 172 H478"/><path d="M684 172 H704"/><path d="M910 172 H930"/></g></g>
</svg>
