<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">#관광데이터활용 기능 흐름도</title><desc id="desc">관광데이터와 식품안전나라 공식 목록을 장소 탐색과 여행 노트에 연결하는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52796f"/></marker></defs><rect width="1200" height="300" rx="28" fill="#f7f6f0"/>
  <text x="48" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#243b36">#관광데이터활용</text><text x="48" y="80" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#52796f">공식 관광·식품 데이터를 지도 후보와 선택 장소 규정에 연결한다</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" text-anchor="middle"><g fill="#ffffff" stroke="#b7c9c0" stroke-width="2"><rect x="32" y="124" width="200" height="96" rx="16"/><rect x="258" y="124" width="200" height="96" rx="16"/><rect x="484" y="124" width="200" height="96" rx="16"/><rect x="710" y="124" width="200" height="96" rx="16"/><rect x="936" y="124" width="232" height="96" rx="16"/></g>
    <g fill="#243b36" font-size="17" font-weight="700"><text x="132" y="164"><tspan x="132">검색 시작</tspan><tspan x="132" dy="25" font-size="14" font-weight="400">서울 명동 또는 사용자 검색</tspan></text><text x="358" y="164"><tspan x="358">KTO API 조회</tspan><tspan x="358" dy="25" font-size="14" font-weight="400">주변·키워드 장소 후보</tspan></text><text x="584" y="164"><tspan x="584">지도에 표시</tspan><tspan x="584" dy="25" font-size="14" font-weight="400">관광지·식당·카페</tspan></text><text x="810" y="164"><tspan x="810">공식 목록 병합</tspan><tspan x="810" dy="25" font-size="14" font-weight="400">식품안전나라 출처 보강</tspan></text><text x="1052" y="164"><tspan x="1052">여행 노트 연결</tspan><tspan x="1052" dy="25" font-size="14" font-weight="400">선택한 장소만 상세 조회</tspan></text></g>
    <g stroke="#52796f" stroke-width="3" marker-end="url(#arrow)"><path d="M232 172 H252"/><path d="M458 172 H478"/><path d="M684 172 H704"/><path d="M910 172 H930"/></g></g>
</svg>
