<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">#PWA접근성 기능 흐름도</title><desc id="desc">브라우저에서 시작해 기기에 설치하고 최신 규정 조회와 오프라인 한계를 안내하는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52796f"/></marker></defs><rect width="1200" height="300" rx="28" fill="#f7f6f0"/>
  <text x="48" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#243b36">#PWA접근성</text><text x="48" y="80" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#52796f">설치 부담은 낮추고, 같은 기기에서 여행 맥락을 이어간다</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" text-anchor="middle"><g fill="#ffffff" stroke="#b7c9c0" stroke-width="2"><rect x="32" y="124" width="200" height="96" rx="16"/><rect x="258" y="124" width="200" height="96" rx="16"/><rect x="484" y="124" width="200" height="96" rx="16"/><rect x="710" y="124" width="200" height="96" rx="16"/><rect x="936" y="124" width="232" height="96" rx="16"/></g>
    <g fill="#243b36" font-size="17" font-weight="700"><text x="132" y="164"><tspan x="132">브라우저 시작</tspan><tspan x="132" dy="25" font-size="14" font-weight="400">회원가입 없이 탐색</tspan></text><text x="358" y="164"><tspan x="358">홈 화면 설치</tspan><tspan x="358" dy="25" font-size="14" font-weight="400">모바일·데스크탑 PWA</tspan></text><text x="584" y="164"><tspan x="584">같은 기기 재진입</tspan><tspan x="584" dy="25" font-size="14" font-weight="400">지도·노트 이어보기</tspan></text><text x="810" y="164"><tspan x="810">온라인 규정 조회</tspan><tspan x="810" dy="25" font-size="14" font-weight="400">최신 공식 데이터 사용</tspan></text><text x="1052" y="164"><tspan x="1052">연결 없을 때 안내</tspan><tspan x="1052" dy="25" font-size="14" font-weight="400">추측하지 않고 한계 표시</tspan></text></g>
    <g stroke="#52796f" stroke-width="3" marker-end="url(#arrow)"><path d="M232 172 H252"/><path d="M458 172 H478"/><path d="M684 172 H704"/><path d="M910 172 H930"/></g></g>
</svg>
